[package]
name = "rqbit-tunnel"
version.workspace = true
edition = "2024"

[features]
default = ["default-tls"]
default-tls = ["librqbit/default-tls"]
rust-tls = ["librqbit/rust-tls"]


[dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
tokio-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
rusqlite.workspace = true
clap.workspace = true
thiserror.workspace = true
tracing.workspace = true
hex.workspace = true
sha2.workspace = true
directories.workspace = true
ratatui.workspace = true
crossterm.workspace = true
arc-swap.workspace = true
librqbit = { workspace = true, default-features = false, features = ["tracing-subscriber-utils"] }

[dev-dependencies]
tempfile.workspace = true
